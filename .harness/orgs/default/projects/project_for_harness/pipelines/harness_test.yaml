pipeline:
  stages:
    - steps:
        - run:
            script: "#!/bin/bash\r

              set -e\r

              \r

              echo \"Current directory:\"\r

              pwd\r

              \r

              echo \"Repository contents:\"\r

              ls -la\r

              \r

              echo \"Application directory:\"\r

              ls -la SmallestSpringApp\r

              \r

              cd SmallestSpringApp\r

              \r

              echo \"Project directory:\"\r

              pwd\r

              \r

              echo \"Checking pom.xml:\"\r

              ls -l pom.xml\r

              \r

              mvn -B clean package"
            shell: bash
          name: maven build
          id: maven_build
