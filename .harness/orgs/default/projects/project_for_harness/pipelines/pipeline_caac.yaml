pipeline:
  stages:
    - steps:
        - run:
            script: "git clone
              https://github.com/jayasriaero15/Smallest-spring-boot-sample.git
              && mvn -f Smallest-spring-boot-sample/SmallestSpringApp/pom.xml -B
              clean package #"
            shell: bash
          name: maven build
          id: maven_build
        - name: Docker build and push
          run:
            shell: bash
            script: |-
              cd /harness/Smallest-spring-boot-sample && mvn -f SmallestSpringApp/pom.xml clean package -DskipTests && cp SmallestSpringApp/target/app.jar app.jar
          id: Docker_build_and_push
        - build:
            uses: buildAndPushToGAR
            with:
              connector: connector_Gcp_c109
              host: asia-south1-docker.pkg.dev
              project_id: project-76f55662-b24c-481a-88e
              image_name: spring-app-repo/spring-app
              tags:
                - latest
              caching: true
              dockerfile: Smallest-spring-boot-sample/Dockerfile
              context: Smallest-spring-boot-sample
          name: docker build
          id: docker_build
    - name: kubernetes deployment
      id: kubernetes_deployment
      service:
        type: kubernetes
        items:
          - spring_app_service
      environment:
        items:
          - id: environment_env_37fe
            deploy-to: infrastructure_kubernetes_gcp_ac7b
      steps:
        - name: Kubernetes Rolling Deploy
          id: k8sRollingDeployStep
          template:
            uses: k8sRollingDeployStep
      rollback:
        - group:
            steps:
              - name: Kubernetes Rolling Rollback
                id: k8sRollingRollbackStep
                template:
                  uses: k8sRollingRollbackStep
          id: k8sRollingRollback
          name: Kubernetes Rolling Rollback
      on-failure:
        errors: all
        action: stage-rollback
      runtime: cloud
