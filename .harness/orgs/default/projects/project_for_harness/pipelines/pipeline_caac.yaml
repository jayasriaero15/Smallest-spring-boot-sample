pipeline:
  stages:
    - steps:
        - run:
            script: "git clone
              https://github.com/jayasriaero15/Smallest-spring-boot-sample.git
              && mvn -f Smallest-spring-boot-sample/SmallestSpringApp/pom.xml -B
              clean package #"
            shell: bash
          name: maven build
          id: maven_build
        - name: Docker build and push
          run:
            shell: bash
            script: docker build -t
              asia-south1-docker.pkg.dev/project-76f55662-b24c-481a-88e/spring-app-repo/spring-app:latest
              . && gcloud auth configure-docker asia-south1-docker.pkg.dev
              --quiet && docker push
              asia-south1-docker.pkg.dev/project-76f55662-b24c-481a-88e/spring-app-repo/spring-app:latest
          id: Docker_build_and_push
